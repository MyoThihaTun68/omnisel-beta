    <script>
      (function (l) {
        if (l.search && l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(
            null,
            null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      })(window.location);
    </script>
    <script>
      try {
        if (localStorage.getItem('omnisel_theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {}
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              omni: {
                bg: '#FFFFFF',
                surface: '#F5F5F5',
                primary: '#EA580C',
                primaryDark: '#C2410C',
                secondary: '#000000',
                text: '#000000',
                textDark: '#000000',
                muted: '#525252',
                border: '#E5E5E5',
              },
              orange: {
                50: '#FFF7ED',
                100: '#FFEDD5',
                200: '#FED7AA',
                300: '#FDBA74',
                400: '#FB923C',
                500: '#EA580C',
                600: '#C2410C',
                700: '#9A3412',
                800: '#7C2D12',
                900: '#431407',
                950: '#000000',
              }
            },
            fontFamily: {
              sans: ['Inter', 'Noto Sans Myanmar', 'sans-serif'],
            },
            boxShadow: {
              'soft': '0 2px 10px rgba(0, 0, 0, 0.03)',
              'card': '0 4px 20px -2px rgba(0, 0, 0, 0.05)',
              'glow': '0 0 15px rgba(0, 0, 0, 0.16)',
            },
            animation: {
              'fade-in': 'fadeIn 0.3s ease-out',
              'slide-up': 'slideUp 0.4s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(10px)', opacity: '0' },

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Pure Light Mode + Signal Orange */
        --bg-primary: #FFFFFF;      /* rgb(255, 255, 255) */
        --bg-surface: #F5F5F5;      /* rgb(245, 245, 245) */
        --bg-elevated: #FAFAFA;     /* rgb(250, 250, 250) */
        --border-subtle: #E5E5E5;   /* rgb(229, 229, 229) */
        --border-strong: #000000;   /* rgb(0, 0, 0) */
        --text-primary: #000000;    /* rgb(0, 0, 0) */
        --text-muted: #525252;      /* rgb(82, 82, 82) */
        --accent-primary: #EA580C;  /* Signal Orange */
        --accent-contrast: #FFFFFF; /* White ink on #EA580C */

        /* Semantic Status Accents */
        --status-live: #10B981;
        --status-warn: #F59E0B;
        --status-error: #EF4444;
      }

      [data-theme="dark"],
      .dark {
        color-scheme: dark;
        /* OLED True Black + Signal Orange */
        --bg-primary: #000000;      /* rgb(0, 0, 0) */
        --bg-surface: #0A0A0A;      /* rgb(10, 10, 10) */
        --bg-elevated: #141414;     /* rgb(20, 20, 20) */
        --border-subtle: #262626;   /* rgb(38, 38, 38) */
        --border-strong: #FFFFFF;   /* rgb(255, 255, 255) */
        --text-primary: #FFFFFF;    /* rgb(255, 255, 255) */
        --text-muted: #A3A3A3;      /* rgb(163, 163, 163) */
        --accent-primary: #FB923C;  /* Signal Orange (OLED) */
        --accent-contrast: #000000; /* Black ink on #FB923C */

        /* Semantic Status Accents */
        --status-live: #10B981;
        --status-warn: #F59E0B;
        --status-error: #EF4444;
      }

      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Inter', 'Noto Sans Myanmar', sans-serif;
        background-color: var(--bg-primary);
        color: var(--text-primary);
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      .bento-card {
        background-color: var(--bg-surface);
        border: 1px solid var(--border-subtle);
        border-radius: 26px;
        box-shadow: none;
        transition: border-color 0.16s ease;
      }
      .bento-card-hover:hover {
        border-color: color-mix(in srgb, var(--accent-primary) 55%, var(--border-subtle));
      }
      .bento-pill-dark {
        background-color: var(--accent-primary);
        color: var(--accent-contrast);
        border-radius: 9999px;
      }
      .tabular-nums { font-variant-numeric: tabular-nums; }
      .scrollbar-hide::-webkit-scrollbar { display: none; }
      .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
      .glass {
        background: color-mix(in srgb, var(--bg-surface) 92%, transparent);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      /* ===== Pure Light / OLED True Black + Signal Orange Mapping ===== */
      .bg-\[\#FAFAFA\],
      .bg-\[\#F6F7FB\],
      .bg-\[\#F6F7FB\]\/85,
      .bg-\[\#F8FAFC\],
      .bg-slate-50\/40,
      .bg-slate-50\/50,
      .bg-slate-50\/70 {
        background-color: var(--bg-primary) !important;
      }
      .bento-card,
      .bg-white,
      .bg-white\/95,
      .bg-white\/90 {
        background-color: var(--bg-surface) !important;
        color: var(--text-primary);
      }
      .bg-slate-50,
      .bg-zinc-50,
      .bg-slate-100,
      .bg-zinc-100,
      .bg-slate-100\/90,
      .bg-slate-100\/60 {
        background-color: var(--bg-elevated) !important;
      }
      .bg-slate-200,
      .bg-zinc-200,
      .bg-slate-200\/60,
      .bg-slate-200\/70,
      .bg-slate-300,
      .bg-\[\#ECEAE4\],
      .bg-\[\#E9E7E1\],
      .bg-\[\#EAE8E2\],
      .bg-orange-950\/10 {
        background-color: var(--border-subtle) !important;
      }
      .hover\:bg-slate-50:hover,
      .hover\:bg-slate-100:hover,
      .hover\:bg-zinc-50:hover,
      .hover\:bg-zinc-100:hover,
      .hover\:bg-slate-200:hover,
      .hover\:bg-\[\#F6F7FB\]:hover,
      .hover\:bg-slate-50\/70:hover,
      .hover\:bg-slate-50\/80:hover,
      .hover\:bg-white:hover {
        background-color: var(--bg-elevated) !important;
      }
      .bg-orange-50,
      .bg-orange-50\/40,
      .bg-orange-50\/60,
      .bg-orange-50\/70,
      .bg-orange-50\/80,
      .bg-orange-50\/90,
      .bg-orange-50\/95,
      .bg-orange-100,
      .bg-orange-100\/80 {
        background-color: color-mix(in srgb, var(--accent-primary) 11%, var(--bg-surface)) !important;
      }
      .hover\:bg-orange-50:hover,
      .hover\:bg-orange-100:hover,
      .hover\:bg-orange-200:hover {
        background-color: color-mix(in srgb, var(--accent-primary) 18%, var(--bg-surface)) !important;
      }
      .border-slate-100,
      .border-slate-200,
      .border-slate-200\/70,
      .border-slate-200\/80,
      .border-slate-200\/90,
      .border-slate-300,
      .border-zinc-200,
      .border-\[\#E2E8F0\],
      .border-\[\#EAE8E1\],
      .divide-slate-100,
      .divide-\[\#E2E8F0\] {
        border-color: var(--border-subtle) !important;
      }
      .border-orange-100,
      .border-orange-200,
      .border-orange-200\/80,
      .border-orange-300 {
        border-color: color-mix(in srgb, var(--accent-primary) 34%, var(--border-subtle)) !important;
      }
      .text-slate-900,
      .text-zinc-900,
      .text-slate-800,
      .text-zinc-800,
      .text-\[\#1E293B\],
      .hover\:text-slate-900,
      .hover\:text-zinc-900,
      .hover\:text-\[\#1E293B\] {
        color: var(--text-primary) !important;
      }
      .text-slate-700,
      .text-zinc-700,
      .text-slate-600,
      .text-zinc-600,
      .text-slate-500,
      .text-zinc-500,
      .text-slate-400,
      .text-zinc-400,
      .text-\[\#64748B\],
      .text-slate-300,
      .text-zinc-300 {
        color: var(--text-muted) !important;
      }
      .text-orange-700,
      .text-orange-800,
      .text-orange-900,
      .text-orange-950 {
        color: var(--accent-primary) !important;
      }
      .text-orange-500, .text-orange-600, .text-orange-400 {
        color: var(--accent-primary) !important;
      }
      .bg-orange-500, .bg-orange-600 {
        background-color: var(--accent-primary) !important;
      }
      .bg-orange-500,
      .bg-orange-600,
      .bg-orange-500 *:not(.bg-white):not(.bg-white *),
      .bg-orange-600 *:not(.bg-white):not(.bg-white *),
      [class*="from-orange-500"]:not(.bg-clip-text),
      [class*="from-orange-500"]:not(.bg-clip-text) *:not(.bg-white):not(.bg-white *) {
        color: var(--accent-contrast) !important;
      }
      .bg-gradient-to-br.from-orange-500:not(.bg-clip-text),
      .bg-gradient-to-r.from-orange-500:not(.bg-clip-text) {
        background-image: none !important;
        background-color: var(--accent-primary) !important;
      }
      .bg-gradient-to-br.from-orange-50 {
        background-image: none !important;
        background-color: var(--bg-primary) !important;
      }
      .ring-orange-200, .ring-white {
        --tw-ring-color: color-mix(in srgb, var(--accent-primary) 35%, transparent) !important;
      }

      /* Semantic Status Badges (Live/Paid #10B981 · Warning #F59E0B · Error #EF4444) */
      .status-live {
        background-color: color-mix(in srgb, var(--status-live) 14%, var(--bg-surface)) !important;
        color: #059669 !important;
        border-color: color-mix(in srgb, var(--status-live) 38%, transparent) !important;
      }
      [data-theme="dark"] .status-live,
      html.dark .status-live {
        color: #34D399 !important;
      }
      .status-live-dot { background-color: var(--status-live) !important; }

      .status-warn {
        background-color: color-mix(in srgb, var(--status-warn) 14%, var(--bg-surface)) !important;
        color: #B45309 !important;
        border-color: color-mix(in srgb, var(--status-warn) 40%, transparent) !important;
      }
      [data-theme="dark"] .status-warn,
      html.dark .status-warn {
        color: #FBBF24 !important;
      }
      .status-warn-dot { background-color: var(--status-warn) !important; }

      .status-error,
      [data-theme="dark"] .bg-red-50,
      html.dark .bg-red-50 {
        background-color: color-mix(in srgb, var(--status-error) 14%, var(--bg-surface)) !important;
        border-color: color-mix(in srgb, var(--status-error) 38%, transparent) !important;
      }
      [data-theme="dark"] .text-red-600,
      [data-theme="dark"] .text-red-700,
      [data-theme="dark"] .text-red-800,
      html.dark .text-red-600,
      html.dark .text-red-700,
      html.dark .text-red-800 {
        color: #F87171 !important;
      }

      input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]),
      select,
      textarea {
        background-color: var(--bg-elevated) !important;
        border-color: var(--border-subtle) !important;
        color: var(--text-primary) !important;
      }
      input::placeholder, textarea::placeholder {
        color: var(--text-muted) !important;
      }
      input:focus, select:focus, textarea:focus {
        border-color: var(--accent-primary) !important;
      }
      .disabled\:bg-slate-200:disabled, .disabled\:bg-slate-300:disabled {
        background-color: var(--border-subtle) !important;
        color: var(--text-muted) !important;
      }

      /* Minimal, restrained button transitions */
      button:not(:disabled),
      a[class*="rounded-"] {
        transition: background-color 0.16s ease, border-color 0.16s ease, color 0.16s ease, opacity 0.16s ease;
      }
      button:not(:disabled):hover,
      a[class*="rounded-"]:hover {
        opacity: 0.90;
      }

      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: var(--bg-primary); }
      ::-webkit-scrollbar-thumb {
        background: var(--border-subtle);
        border-radius: 9999px;
        border: 2px solid var(--bg-primary);
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--accent-primary); }

      /* Tech By ReX (T-ReX) 3D CSS Digital Coin */
      .tbr-coin-scene {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        perspective: 1000px;
      }
      .tbr-coin {
        width: 100%;
        height: 100%;
        position: relative;
        transform-style: preserve-3d;
      }
      .tbr-coin-spin {
        animation: tbrSpin 7s linear infinite;
      }
      .tbr-face {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 25%, #fef08a 0%, #facc15 35%, #d97706 78%, #92400e 100%) !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        color: #451a03 !important;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        overflow: hidden;
      }
      .tbr-edge {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        background: linear-gradient(145deg, #b45309 0%, #f59e0b 45%, #78350f 100%) !important;
      }
      :root .tbr-coin-scene .tbr-face,
      :root .tbr-coin-scene .tbr-face *,
      html.dark .tbr-coin-scene .tbr-face,
      html.dark .tbr-coin-scene .tbr-face * {
        color: #451a03 !important;
        fill: #451a03 !important;
      }
      .tbr-core {
        width: 76%;
        height: 76%;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, #fde047 0%, #eab308 58%, #b45309 100%) !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        line-height: 1;
        text-align: center;
      }
      @keyframes tbrSpin {
        0%   { transform: rotateX(6deg) rotateY(0deg); }
        100% { transform: rotateX(6deg) rotateY(360deg); }
      }

      /* Omni — Living Myanmar Thanaka Robot Mascot Animations */
      .omnisel-logo-animated .omnisel-bot-float {
        animation: omniBotFloat 3.2s ease-in-out infinite;
        transform-origin: 32px 38px;
      }
      .omnisel-logo-excited .omnisel-bot-float {
        animation: omniBotBounce 0.55s cubic-bezier(0.22, 1, 0.36, 1) infinite;
        transform-origin: 32px 38px;
      }
      .omnisel-logo-animated .omnisel-bot-eyes {
        animation: omniBotBlink 4.2s ease-in-out infinite;
        transform-origin: 32px 35px;
      }
      .omnisel-logo-animated .omnisel-bot-pupils {
        animation: omniBotLook 7.5s ease-in-out infinite;
      }
      .omnisel-logo-animated .omnisel-bot-antenna {
        animation: omniBotWave 3.2s ease-in-out infinite;
        transform-origin: 32px 20px;
      }
      @keyframes omniBotFloat {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        35% { transform: translateY(-2px) rotate(-1.6deg); }
        70% { transform: translateY(-1.2px) rotate(1.6deg); }
      }
      @keyframes omniBotBounce {
        0%, 100% { transform: translateY(0px) scale(1); }
        45% { transform: translateY(-4px) scale(1.04); }
      }
      @keyframes omniBotBlink {
        0%, 42%, 46%, 90%, 94%, 100% { transform: scaleY(1); }
        44%, 92% { transform: scaleY(0.1); }
      }
      @keyframes omniBotLook {
        0%, 30%, 100% { transform: translateX(0px); }
        42%, 56% { transform: translateX(1.6px); }
        70%, 84% { transform: translateX(-1.6px); }
      }
      @keyframes omniBotWave {
        0%, 100% { transform: rotate(0deg); }
        30% { transform: rotate(-6deg); }
        70% { transform: rotate(6deg); }
      }

      /* Omni 1-by-1 Guided Spotlight & Pointer Animations */
      .omni-tour-spotlight {
        transition:
          top 0.42s cubic-bezier(0.22, 1, 0.36, 1),
          left 0.42s cubic-bezier(0.22, 1, 0.36, 1),
          width 0.42s cubic-bezier(0.22, 1, 0.36, 1),
          height 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .omni-tour-card {
        transition:
          top 0.42s cubic-bezier(0.22, 1, 0.36, 1),
          left 0.42s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .omni-pointer-nudge-left {
        animation: omniPointerNudgeLeft 1.2s ease-in-out infinite;
      }
      .omni-pointer-nudge-down {
        animation: omniPointerNudgeDown 1.2s ease-in-out infinite;
      }
      @keyframes omniPointerNudgeLeft {
        0%, 100% { transform: translateX(0px); }
        50% { transform: translateX(-6px); }
      }
      @keyframes omniPointerNudgeDown {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(6px); }
      }

      /* Omni Live Desk Lifestyle Animations */
      .omni-desk-typing {
        animation: omniDeskTyping 0.55s ease-in-out infinite;
        transform-origin: 94px 85px;
      }
      .omni-desk-hands {
        animation: omniDeskHands 0.28s ease-in-out infinite;
      }
      .omni-desk-startle {
        animation: omniDeskStartle 0.45s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        transform-origin: 94px 85px;
      }
      .omni-desk-sleep {
        animation: omniDeskSleep 3.2s ease-in-out infinite;
        transform-origin: 94px 92px;
      }
      .omni-desk-zzz {
        animation: omniDeskZzz 2.4s ease-in-out infinite;
      }
      .omni-desk-gaming {
        animation: omniDeskGaming 0.9s ease-in-out infinite;
        transform-origin: 94px 85px;
      }
      .omni-desk-idle {
        animation: omniDeskIdle 3s ease-in-out infinite;
        transform-origin: 94px 85px;
      }
      .omni-desk-code1 {
        animation: omniDeskCode 1.1s ease-in-out infinite;
      }
      .omni-desk-code2 {
        animation: omniDeskCode 1.1s ease-in-out 0.45s infinite;
      }
      @keyframes omniDeskTyping {
        0%, 100% { transform: translateX(4px) translateY(0px) rotate(3deg); }
        50% { transform: translateX(5px) translateY(-1.5px) rotate(4.5deg); }
      }
      @keyframes omniDeskHands {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2.5px); }
      }
      @keyframes omniDeskStartle {
        0% { transform: translateY(0px) scale(1); }
        35% { transform: translateY(-14px) scale(1.06) rotate(-5deg); }
        70% { transform: translateY(-3px) scale(0.98) rotate(3deg); }
        100% { transform: translateY(0px) scale(1) rotate(0deg); }
      }
      @keyframes omniDeskSleep {
        0%, 100% { transform: translateY(5px) rotate(-5deg); }
        50% { transform: translateY(7px) rotate(-3deg); }
      }
      @keyframes omniDeskZzz {
        0% { opacity: 0.25; transform: translate(0px, 4px); }
        50% { opacity: 1; transform: translate(3px, -3px); }
        100% { opacity: 0.25; transform: translate(6px, -8px); }
      }
      @keyframes omniDeskGaming {
        0%, 100% { transform: translateY(0px) rotate(-2deg); }
        50% { transform: translateY(-2.5px) rotate(2.5deg); }
      }
      @keyframes omniDeskIdle {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-2px); }
      }
      @keyframes omniDeskCode {
        0%, 100% { opacity: 0.45; }
        50% { opacity: 1; }
      }

      /* Smooth GPU-composited Page Transitions (no persistent transform so fixed modals stay full-viewport) */
      @keyframes pageEnter {
        0% {
          opacity: 0;
          transform: translateY(8px);
        }
        100% {
          opacity: 1;
